services:
  postgres:
    image: postgres:18
    container_name: kambrasil-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kambrasil}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-kambrasil}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      # PG18 mudou o VOLUME de /var/lib/postgresql/data para /var/lib/postgresql
      # (o PGDATA real vive em 18/docker). Montar no caminho antigo NAO persiste.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kambrasil} -d ${POSTGRES_DB:-kambrasil}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
