[package]
name = "launcher"
version = "0.1.0"
description = "Launcher do Kam Brasil"
authors = ["Kam Brasil"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# rustls em vez do TLS da plataforma: mesmo comportamento no Windows e no Linux,
# sem depender de SChannel/OpenSSL do sistema.
# webpki-roots embute a store de certificados: mesmo comportamento em qualquer
# maquina, sem depender do que o SO tem instalado.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "webpki-roots"] }

# Guarda o token no cofre do sistema (Gerenciador de Credenciais no Windows).
# Os backends de Windows, macOS e Linux ja vem habilitados por padrao.
keyring = "4"

# Verificacao de integridade do cliente baixado.
sha2 = "0.10"

# Localiza a pasta Documentos respeitando redirecionamento (OneDrive, por
# exemplo). Hardcodar %USERPROFILE%\Documents erraria nessas maquinas.
dirs = "6"

# fs/io assincronos para o download. O Tauri ja usa tokio; declaramos as
# features que precisamos em vez de depender das dele por acaso.
tokio = { version = "1", features = ["fs", "io-util"] }

[dev-dependencies]
# Runtime para os testes de integracao de auth.rs (rodam com --ignored).
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
